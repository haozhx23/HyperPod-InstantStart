AWSTemplateFormatVersion: '2010-09-09'
Description: 'HyperPod InstantStart workspace (for EKS orchestrated HyperPod)'

Parameters:
  InstanceName:
    Type: String
    Default: eks-hypd-dev-instance
    Description: Name for the EC2 instance
    
  InstanceType:
    Type: String
    Default: m5.xlarge
    Description: EC2 instance type (e.g., c5.xlarge, m5.xlarge)
    
  KeyPairName:
    Type: String
    Default: ""
    Description: Name of the EC2 KeyPair for SSH access (leave empty to use SSM Session Manager only)
    
  EBSVolumeSize:
    Type: Number
    Default: 200
    MinValue: 8
    MaxValue: 16384
    Description: Size of the EBS root volume in GB (minimum 8 GB, maximum 16384 GB)
    
  VpcId:
    Type: String
    Default: ""
    Description: VPC ID where the instance will be launched (leave empty for default VPC)
    
  SubnetId:
    Type: String  
    Default: ""
    Description: Subnet ID where the instance will be launched (leave empty for default subnet)
    
  SecurityGroupId:
    Type: String
    Default: ""
    Description: Security Group ID to use (required when VpcId/SubnetId are specified, leave empty for default VPC)
    
  ResourceTag:
    Type: String
    Default: hypd-dev
    Description: Resource tag prefix for naming resources (e.g., hypd-dev, eks-prod)

  ExistingS3BucketName:
    Type: String
    Default: ""
    Description: Existing S3 bucket name to use (leave empty to create a new one)

  LatestUbuntu2204AMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Latest Ubuntu 22.04 LTS AMI ID

Conditions:
  HasVpcId: !Not [!Equals [!Ref VpcId, ""]]
  HasSubnetId: !Not [!Equals [!Ref SubnetId, ""]]
  HasSecurityGroupId: !Not [!Equals [!Ref SecurityGroupId, ""]]
  UseCustomVpc: !And 
    - !Condition HasVpcId
    - !Condition HasSubnetId
    - !Condition HasSecurityGroupId
  UseDefaultVpc: !Not [!Condition UseCustomVpc]
  CreateS3Bucket: !Equals [!Ref ExistingS3BucketName, ""]
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  # S3 Bucket for HYPD resources (only if not using existing)
  HYPDUserBucket:
    Type: AWS::S3::Bucket
    Condition: CreateS3Bucket
    Properties:
      BucketName: !Sub '${ResourceTag}-s3-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourceTag}-bucket'

  # Deployment and operations role. Keep the existing logical ID and role name
  # so stack updates do not replace the role or break consumers of its ARN.
  # Permission scope and compatibility choices: IAM_PERMISSIONS.md.
  EKSPlusHYPDAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourceTag}-admin-role'
      Description: HyperPod InstantStart deployment and operations role with service-scoped permissions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - ecr.amazonaws.com
                - eks.amazonaws.com
                - bedrock.amazonaws.com
                - cloudformation.amazonaws.com
                - sagemaker.amazonaws.com
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InstantStartPlatformOperations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Service-wide access preserves provisioning, imported resources,
              # cross-region management, storage selection and add-on upgrades.
              - Sid: PlatformServices
                Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - eks:*
                  - sagemaker:*
                  - sagemaker-mlflow:*
                  - s3:*
                  - fsx:*
                  - lambda:*
                  - ecr:*
                  - ecr-public:*
                  - elasticloadbalancing:*
                  - autoscaling:*
                  - application-autoscaling:*
                  - sqs:*
                  - events:*
                  - aps:*
                  - logs:*
                  - cloudwatch:*
                Resource: '*'
              - Sid: ResourceAndQuotaDiscovery
                Effect: Allow
                Action:
                  - tag:GetResources
                  - tag:GetTagKeys
                  - tag:GetTagValues
                  - servicequotas:Get*
                  - servicequotas:List*
                  - cloudtrail:LookupEvents
                Resource: '*'
              - Sid: EncryptedStorage
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:ListKeys
                  - kms:ListAliases
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:ListGrants
                  - kms:RevokeGrant
                Resource: '*'
              - Sid: StorageServiceGrants
                Effect: Allow
                Action: kms:CreateGrant
                Resource: '*'
                Condition:
                  Bool:
                    kms:GrantIsForAWSResource: 'true'
        - PolicyName: InstantStartIdentityOperations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IdentityDiscoveryAndPolicyChecks
                Effect: Allow
                Action:
                  - iam:Get*
                  - iam:List*
                  - iam:SimulateCustomPolicy
                  - iam:SimulatePrincipalPolicy
                  - access-analyzer:ValidatePolicy
                Resource: '*'
              # Do not require role-name prefixes: imported clusters and
              # existing execution roles can use customer-selected names.
              - Sid: AccountRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*'
              - Sid: AccountPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/*'
              - Sid: AccountInstanceProfiles
                Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*'
              - Sid: AccountOIDCProviders
                Effect: Allow
                Action:
                  - iam:CreateOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider
                  - iam:AddClientIDToOpenIDConnectProvider
                  - iam:RemoveClientIDFromOpenIDConnectProvider
                  - iam:UpdateOpenIDConnectProviderThumbprint
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/*'
              - Sid: AccountServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
              - Sid: PassRolesToPlatformServices
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ec2.amazonaws.com
                      - eks.amazonaws.com
                      - eks-nodegroup.amazonaws.com
                      - pods.eks.amazonaws.com
                      - sagemaker.amazonaws.com
                      - hyperpod.sagemaker.amazonaws.com
                      - lambda.amazonaws.com
                      - cloudformation.amazonaws.com
                      - autoscaling.amazonaws.com
                      - application-autoscaling.amazonaws.com
        - PolicyName: InstantStartSessions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SystemsManager
                Effect: Allow
                Action:
                  - ssm:*
                  - ssmmessages:*
                  - ec2messages:*
                Resource: '*'
              - Sid: CallerIdentity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
              - Sid: ECRPublicLogin
                Effect: Allow
                Action: sts:GetServiceBearerToken
                Resource: '*'
                Condition:
                  StringEquals:
                    sts:AWSServiceName: ecr-public.amazonaws.com
              # Cross-account MLflow synchronization uses STS AssumeRole.
              - Sid: AssumeTrustedRoles
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/*'

  # Instance Profile
  HYPDInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'instance-profile-${EKSPlusHYPDAdminRole}'
      Roles:
        - !Ref EKSPlusHYPDAdminRole

  # Security Group (only for default VPC)
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseDefaultVpc
    Properties:
      GroupName: !Sub '${ResourceTag}-entry-sg'
      GroupDescription: Security group for entry instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # - IpProtocol: tcp
        #   FromPort: 3098
        #   ToPort: 3099
        #   CidrIp: 0.0.0.0/0

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: 
      - HYPDInstanceProfile
    Properties:
      ImageId: !Ref LatestUbuntu2204AMI
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref HYPDInstanceProfile
      SecurityGroupIds: !If [UseCustomVpc, !Ref "AWS::NoValue", [!Ref SecurityGroup]]
      NetworkInterfaces: !If 
        - UseCustomVpc
        - - AssociatePublicIpAddress: true
            DeviceIndex: 0
            SubnetId: !Ref SubnetId
            GroupSet: [!Ref SecurityGroupId]
        - !Ref "AWS::NoValue"
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref EBSVolumeSize
            DeleteOnTermination: true
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          
          # Create log file
          LOG_FILE="/var/log/dependency-install.log"
          
          # Run all installs in a subshell piped to tee (for logging)
          # cfn-signal stays outside so it never gets stuck in the pipe
          (
          echo "Starting dependency installation at $(date)"
          
          export NEEDRESTART_MODE=a
          export DEBIAN_FRONTEND=noninteractive
          
          apt-get update -y
          apt-get install -y zip unzip curl wget python3-pip docker.io s3fs
          apt-get install -y jq
          
          systemctl start docker
          systemctl enable docker
          usermod -aG docker ubuntu
          chmod 666 /var/run/docker.sock
          
          pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
          
          AWS_CLI_VERSION=2.40.3
          AWS_CLI_SHA256=4770c06c4ecfc8ba94b60d89e6c7018ab7ea2cf5341b1ef05f6f93c5d6e8b705
          KUBECTL_VERSION=1.35.10
          KUBECTL_SHA256=c49a28f1f4efc4d475ed05f47f2ce8e563bf7bef69ed77fe1b924ea6d83b6327
          EKSCTL_VERSION=0.231.0
          EKSCTL_SHA256=13cd1c4ae6ad3f74ea27aa1117c72e34ffa4ca8ff6d709261f7b1d7f411dc435
          HELM_VERSION=3.22.1
          HELM_SHA256=896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea

          curl -fsSLo awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-$AWS_CLI_VERSION.zip"
          echo "$AWS_CLI_SHA256  awscliv2.zip" | sha256sum -c -
          unzip awscliv2.zip
          ./aws/install --update
          rm -rf awscliv2.zip aws/
          
          sudo -u ubuntu aws configure set region ${AWS::Region}
          sudo -u ubuntu aws configure set output json
          
          curl -fsSLo kubectl "https://dl.k8s.io/release/v$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  kubectl" | sha256sum -c -
          install -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl
          
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH
          curl -fsSLo "eksctl_$PLATFORM.tar.gz" "https://github.com/eksctl-io/eksctl/releases/download/v$EKSCTL_VERSION/eksctl_$PLATFORM.tar.gz"
          echo "$EKSCTL_SHA256  eksctl_$PLATFORM.tar.gz" | sha256sum -c -
          tar -xzf eksctl_$PLATFORM.tar.gz -C /tmp
          rm eksctl_$PLATFORM.tar.gz
          mv /tmp/eksctl /usr/local/bin
          
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz
          install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64

          aws --version
          kubectl version --client
          eksctl version
          helm version --short
          
          # curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo -u ubuntu curl -LsSf https://astral.sh/uv/install.sh | sudo -u ubuntu sh
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> /home/ubuntu/.bashrc
          chown ubuntu:ubuntu /home/ubuntu/.bashrc
          
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          dpkg -i session-manager-plugin.deb
          rm session-manager-plugin.deb
          
          # FSx Lustre client (official method: https://docs.aws.amazon.com/fsx/latest/FileCacheGuide/install-lustre-client.html)
          # 只配置 APT 源 + GPG key + 用户态工具，kmod 留给运行时脚本按 `uname -r` 对齐安装
          # （首次启动时 linux-image-aws 会被 apt 升级到仓库最新版，而 uname -r 仍是 AMI 内置旧内核，
          #  此时装 meta 包 lustre-client-modules-aws 必然错配，导致 modprobe lustre 失败）
          wget -q -O - https://fsx-lustre-client-repo-public-keys.s3.amazonaws.com/fsx-ubuntu-public-key.asc | gpg --dearmor | tee /usr/share/keyrings/fsx-ubuntu-public-key.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/fsx-ubuntu-public-key.gpg] https://fsx-lustre-client-repo.s3.amazonaws.com/ubuntu jammy main" > /etc/apt/sources.list.d/fsxlustreclientrepo.list
          apt-get update -y
          apt-get install -y lustre-client-utils
          # apt-get install -y lustre-client-modules-aws   # 已由 setup-fsx-peering-*.sh 在运行时按当前内核安装
          
          mkdir -p /home/ubuntu/workspace/s3
          chown ubuntu:ubuntu /home/ubuntu/workspace /home/ubuntu/workspace/s3
          
          # Configure fuse for allow_other
          echo "user_allow_other" >> /etc/fuse.conf
          
          # S3_BUCKET_NAME="${ResourceTag}-${AWS::AccountId}-${AWS::Region}"
          # S3_BUCKET_NAME="${ResourceTag}-${AWS::Region}"
          if [ -n "${ExistingS3BucketName}" ]; then
            S3_BUCKET_NAME="${ExistingS3BucketName}"
          else
            S3_BUCKET_NAME="${ResourceTag}-s3-${AWS::Region}"
          fi
          
          # Add to fstab for persistent mounting
          echo "$S3_BUCKET_NAME /home/ubuntu/workspace/s3 fuse.s3fs _netdev,user,iam_role=${EKSPlusHYPDAdminRole},allow_other,uid=1000,gid=1000 0 0" >> /etc/fstab

          sudo -u ubuntu s3fs $S3_BUCKET_NAME /home/ubuntu/workspace/s3 -o iam_role=${EKSPlusHYPDAdminRole},allow_other,uid=1000,gid=1000 > /dev/null 2>&1

          # sudo -u ubuntu bash -c "echo '{\"bucketName\":\"'$S3_BUCKET_NAME'\",\"awsRegion\":\"${AWS::Region}\",\"createTime\":\"'\$(date -Iseconds)'\"}' > /home/ubuntu/workspace/s3/CURRENT_BUCKET_INFO"
          sudo -u ubuntu bash -c 'echo "{\"bucketName\":\"'$S3_BUCKET_NAME'\",\"awsRegion\":\"${AWS::Region}\",\"createTime\":\"$(date -Iseconds)\"}" > /home/ubuntu/workspace/s3/CURRENT_BUCKET_INFO'
          chown ubuntu:ubuntu /home/ubuntu
          
          echo "Installation completed at $(date)"
          ) 2>&1 | tee -a $LOG_FILE
          
          /usr/local/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Sub '${ResourceTag}-instance'
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M

Outputs:
  InstanceId:
    Value: !Ref EC2Instance
    Description: EC2 Instance ID
  InstancePublicIP:
    Value: !GetAtt EC2Instance.PublicIp
    Description: Public IP address of the EC2 instance
  S3BucketName:
    Value: !If [CreateS3Bucket, !Ref HYPDUserBucket, !Ref ExistingS3BucketName]
    Description: Name of the S3 bucket
  S3BucketArn:
    Value: !If 
      - CreateS3Bucket
      - !GetAtt HYPDUserBucket.Arn
      - !Sub 'arn:aws:s3:::${ExistingS3BucketName}'
    Description: ARN of the S3 bucket
  IAMRoleName:
    Value: !Ref EKSPlusHYPDAdminRole
    Description: Name of the IAM role
  IAMRoleArn:
    Value: !GetAtt EKSPlusHYPDAdminRole.Arn
    Description: ARN of the IAM role
  InstanceProfileName:
    Value: !Ref HYPDInstanceProfile
    Description: Name of the Instance Profile
  InstanceProfileArn:
    Value: !GetAtt HYPDInstanceProfile.Arn
    Description: ARN of the Instance Profile
  SecurityGroupId:
    Condition: UseDefaultVpc
    Value: !Ref SecurityGroup
    Description: Security Group ID (only for default VPC)
