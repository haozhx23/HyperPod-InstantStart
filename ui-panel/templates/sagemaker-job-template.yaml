apiVersion: sagemaker.services.k8s.aws/v1alpha1
kind: TrainingJob
metadata:
  name: "${JOB_NAME}"
  namespace: default
spec:
  trainingJobName: "${JOB_NAME}"
  roleARN: "${SAGEMAKER_DEV_ROLE}"

  algorithmSpecification:
    trainingImage: "${DOCKER_IMAGE}"
    trainingInputMode: FastFile

  inputDataConfig:
    - channelName: userdatas
      dataSource:
        s3DataSource:
          s3DataType: S3Prefix
          s3URI: "s3://${S3_BUCKET}/smtj-recipes/${SAGEMAKER_JOB_DIR}/"
          s3DataDistributionType: FullyReplicated
      compressionType: None

  outputDataConfig:
    s3OutputPath: "s3://${S3_BUCKET}/smtj-recipes/${SAGEMAKER_JOB_DIR}/output/"

  resourceConfig:
    instanceType: "${INSTANCE_TYPE}"
    instanceCount: ${REPLICAS}
    volumeSizeInGB: 200
    keepAlivePeriodInSeconds: 1200

  stoppingCondition:
    maxRuntimeInSeconds: 86400
    # maxWaitTimeInSeconds: ${MAX_WAIT_SECONDS}   # 仅 spot 训练时启用

  enableManagedSpotTraining: ${ENABLE_SPOT}

  checkpointConfig:
    s3URI: "s3://${S3_BUCKET}/smtj-recipes/${SAGEMAKER_JOB_DIR}/checkpoints/"
    localPath: /opt/ml/checkpoints

  # hyperParameters:
  #   batch-size: "64"
  #   epochs: "10"
  #   lr: "0.005"

  environment:
    SAGEMAKER_PROGRAM: "/opt/ml/input/data/userdatas/${ENTRY_PYTHON_PATH}"
    SM_PATH: "/opt/ml/input/data/userdatas"
    NCCL_SOCKET_IFNAME: "eth0"
    FI_PROVIDER: "efa"
    NCCL_DEBUG: "DEBUG"
    NPROC_PER_NODE: "${NPROC_PER_NODE}"
    N_NODES: "${REPLICAS}"
    BASE_JOB_NAME: "${JOB_NAME}"
    HYP_PARAMS: "${PYTHON_SCRIPT_PARAMS}"
