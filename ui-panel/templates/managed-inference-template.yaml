apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: "${DEPLOYMENT_NAME}"
  namespace: default
spec:
  modelName: "${MODEL_NAME}"
  invocationEndpoint: v1/chat/completions
  instanceType: "${INSTANCE_TYPE}"
  replicas: ${REPLICAS}
  metrics:
    enabled: true
    modelMetrics:
      port: ${PORT}
  modelSourceConfig:
    modelSourceType: s3
    s3Storage:
      bucketName: "${S3_BUCKET}"
      region: "${AWS_REGION}"
    modelLocation: "${MODEL_LOCATION}"
  worker:
    image: "${DOCKER_IMAGE}"
    args:
    modelInvocationPort:
      containerPort: ${PORT}
    modelVolumeMount:
      name: model-weights
    resources:
      requests:
        nvidia.com/gpu: "${GPU_COUNT}"
      limits:
        nvidia.com/gpu: "${GPU_COUNT}"
    environmentVariables:
      - name: HF_HUB_OFFLINE
        value: "1"
