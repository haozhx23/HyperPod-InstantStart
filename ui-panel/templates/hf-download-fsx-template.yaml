apiVersion: batch/v1
kind: Job
metadata:
  name: "hf-download-job-${JOB_NAME}"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: "hf-download-job-${JOB_NAME}"
    spec:
      containers:
        - name: python-container
          image: python:3.12
          command: ["/bin/bash"]
          args:
            - -c
            - |
              set -euo pipefail
              echo "Installing HF CLI ..."
              python -m pip install --no-cache-dir huggingface_hub==1.26.0 hf_xet==1.5.2
              echo "Downloading directly to FSx..."
              DEST_DIR="/fsx/${MODEL_DIR_NAME}"
              mkdir -p "$DEST_DIR"
              download_args=("$MODEL_ID" --local-dir "$DEST_DIR" --cache-dir /nvme/.cache/huggingface --max-workers "$MAX_WORKERS")
              if [[ "$REPO_TYPE" == "dataset" ]]; then
                download_args=(--repo-type dataset "${download_args[@]}")
              fi
              hf download "${download_args[@]}"
              echo "Download to FSx Complete ..."
          volumeMounts:
            - name: persistent-storage-fsx
              mountPath: /fsx
              readOnly: false
            - name: local-nvme
              mountPath: /nvme
            - name: shm
              mountPath: /dev/shm
          env:
            - name: HF_HOME
              value: "/nvme/.cache/huggingface"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "120"
            - name: MODEL_ID
              value: "${MODEL_ID}"
            - name: MODEL_DIR_NAME
              value: "${MODEL_DIR_NAME}"
            - name: REPO_TYPE
              value: "${REPO_TYPE}"
            - name: MAX_WORKERS
              value: "${MAX_WORKERS}"
      volumes:
        - name: persistent-storage-fsx
          persistentVolumeClaim:
            claimName: "${PVC_NAME}"
        - name: local-nvme
          hostPath:
            path: /opt/dlami/nvme
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      restartPolicy: Never
