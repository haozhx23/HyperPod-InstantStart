---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${APP_NAME}"
  labels:
    app: "${APP_NAME}"
    model-type: "${MODEL_TYPE}"
    deployment-tag: "${DEPLOYMENT_TAG}"
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: "${APP_NAME}"
  template:
    metadata:
      labels:
        app: "${APP_NAME}"
        model-type: "${MODEL_TYPE}"
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: sagemaker.amazonaws.com/compute-type
                    operator: In
                    values: ["hyperpod"]
            - weight: 90
              preference:
                matchExpressions:
                  - key: alpha.eksctl.io/nodegroup-name
                    operator: Exists
            - weight: 80
              preference:
                matchExpressions:
                  - key: karpenter.sh/capacity-type
                    operator: Exists
      containers:
        - name: "${MODEL_TYPE}"
          image: "${DOCKER_IMAGE}"
          ports:
            - containerPort: ${PORT}
              name: http
          volumeMounts:
            - name: persistent-storage-s3
              mountPath: /s3
              readOnly: true
            - name: local-cache
              mountPath: /root/.cache
            - name: shm
              mountPath: /dev/shm
          env:
            - name: HF_HOME
              value: "/root/.cache/huggingface"
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
      volumes:
        - name: persistent-storage-s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: local-cache
          hostPath:
            path: /opt/dlami/nvme/.cache
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            # sizeLimit: 2Gi
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
