apiVersion: batch/v1
kind: Job
metadata:
  name: "hf-download-job-${JOB_NAME}"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: "hf-download-job-${JOB_NAME}"
    spec:
      # nodeSelector:
      #   sagemaker.amazonaws.com/compute-type: hyperpod
      containers:
        - name: python-container
          image: python:3.12
          command: ["/bin/bash"]
          args:
            - -c
            - |
              set -euo pipefail
              echo "Installing HF CLI ..."
              python -m pip install --no-cache-dir huggingface_hub==1.26.0 hf_xet==1.5.2
              echo "Downloading from HuggingFace..."
              STAGING_DIR="/nvme/hf-downloads/${MODEL_DIR_NAME}"
              DEST_DIR="/s3/${MODEL_DIR_NAME}"
              mkdir -p "$STAGING_DIR"
              download_args=("$MODEL_ID" --local-dir "$STAGING_DIR" --cache-dir /root/.cache/huggingface --max-workers "$MAX_WORKERS")
              if [[ "$REPO_TYPE" == "dataset" ]]; then
                download_args=(--repo-type dataset "${download_args[@]}")
              fi
              hf download "${download_args[@]}"
              echo "Downloading Complete ..."
              rm -rf "$STAGING_DIR/.cache"
              mkdir -p "$DEST_DIR"
              cp -r "$STAGING_DIR"/. "$DEST_DIR"/
              rm -rf "$STAGING_DIR"
              echo "Transfer to S3 Complete ..."
          volumeMounts:
            - name: persistent-storage-s3
              mountPath: /s3
              readOnly: false
            - name: local-cache
              mountPath: /root/.cache
            - name: local-nvme
              mountPath: /nvme
            - name: shm
              mountPath: /dev/shm
          env:
            - name: HF_HOME
              value: "/root/.cache/huggingface"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "120"
            - name: MODEL_ID
              value: "${MODEL_ID}"
            - name: MODEL_DIR_NAME
              value: "${MODEL_DIR_NAME}"
            - name: REPO_TYPE
              value: "${REPO_TYPE}"
            - name: MAX_WORKERS
              value: "${MAX_WORKERS}"
      volumes:
        - name: persistent-storage-s3
          persistentVolumeClaim:
            claimName: "${PVC_NAME}"
        - name: local-cache
          hostPath:
            path: /opt/dlami/nvme/.cache
            type: DirectoryOrCreate
        - name: local-nvme
          hostPath:
            path: /opt/dlami/nvme
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      restartPolicy: Never
