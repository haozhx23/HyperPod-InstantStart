apiVersion: batch/v1
kind: Job
metadata:
  name: "hf-download-job-${JOB_NAME}"
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: "hf-download-job-${JOB_NAME}"
    spec:
      # nodeSelector:
      #   sagemaker.amazonaws.com/compute-type: hyperpod
      containers:
        - name: python-container
          image: python:3.12
          command: ["/bin/bash"]
          args:
            - -c
            - |
              echo "Installing HF CLI ..."
              pip install -U "huggingface_hub[cli,hf_transfer]"
              echo "Downloading from HuggingFace..."
              #  --token=$HF_TOKEN
              hf download ${REPO_TYPE_ARG}${MODEL_ID} --local-dir /nvme/${MODEL_ID} --cache-dir /root/.cache/${MODEL_ID}
              echo "Downloading Complete ..."
              rm -rf /nvme/${MODEL_ID}/.cache
              mkdir -p /s3/$(echo ${MODEL_ID} | tr '/' '-')
              cp -r /nvme/${MODEL_ID}/* /s3/$(echo ${MODEL_ID} | tr '/' '-')/
              echo "Transfer to S3 Complete ..."
          volumeMounts:
            - name: persistent-storage-s3
              mountPath: /s3
              readOnly: false
            - name: local-cache
              mountPath: /root/.cache
            - name: local-nvme
              mountPath: /nvme
            - name: shm
              mountPath: /dev/shm
          env:
            - name: HF_HOME
              value: "/root/.cache/huggingface"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "60"
      volumes:
        - name: persistent-storage-s3
          persistentVolumeClaim:
            claimName: "${PVC_NAME}"
        - name: local-cache
          hostPath:
            path: /opt/dlami/nvme/.cache
            type: DirectoryOrCreate
        - name: local-nvme
          hostPath:
            path: /opt/dlami/nvme
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      restartPolicy: Never
