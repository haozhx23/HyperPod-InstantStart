# RayJob (generic): 通用 .sh 入口，无框架绑定。
# Ray 自身管理 rank / 节点通信，用户 sh 里用 python3 + ray init 即可。
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: "${JOB_NAME}"
  namespace: default
spec:
  entrypoint: "bash ${ENTRY_SCRIPT_PATH}"
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: ${DEADLINE_SECONDS}
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      containers:
        - name: ray-job-submitter
          image: "${DOCKER_IMAGE}"
  rayClusterSpec:
    rayVersion: '2.9.0'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        dashboard-port: '8265'
      template:
        metadata:
          labels:
            hami.io/webhook: ignore
        spec:
          nodeSelector:
            beta.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
          containers:
            - name: ray-head
              image: "${DOCKER_IMAGE}"
              resources:
                limits:
                  nvidia.com/gpu: ${GPU_PER_NODE}
                  vpc.amazonaws.com/efa: ${EFA_PER_NODE}
                requests:
                  nvidia.com/gpu: ${GPU_PER_NODE}
                  vpc.amazonaws.com/efa: ${EFA_PER_NODE}
              env:
                - name: FI_PROVIDER
                  value: "efa"
                - name: NCCL_DEBUG
                  value: "INFO"
                - name: NCCL_SOCKET_IFNAME
                  value: "eth0"
              volumeMounts:
                - name: persistent-storage-s3
                  mountPath: /s3
                  readOnly: false
                - name: persistent-storage-fsx
                  mountPath: /fsx
                - name: shmem
                  mountPath: /dev/shm
                - name: local
                  mountPath: /local
                - name: inst-nvme
                  mountPath: /nvme
                - name: local-cache
                  mountPath: /root/.cache
          volumes:
            - name: shmem
              hostPath:
                path: /dev/shm
            - name: local
              hostPath:
                path: /mnt/k8s-disks/0
            - name: local-cache
              hostPath:
                path: /opt/dlami/nvme/.cache
            - name: inst-nvme
              hostPath:
                path: /opt/dlami/nvme/
            - name: persistent-storage-s3
              persistentVolumeClaim:
                claimName: s3-claim
            - name: persistent-storage-fsx
              persistentVolumeClaim:
                claimName: fsx-claim
    workerGroupSpecs:
      - replicas: ${WORKER_REPLICAS}
        minReplicas: 0
        maxReplicas: ${MAX_REPLICAS}
        groupName: worker-group
        rayStartParams: {}
        template:
          metadata:
            labels:
              hami.io/webhook: ignore
          spec:
            nodeSelector:
              beta.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
            containers:
              - name: ray-worker
                image: "${DOCKER_IMAGE}"
                resources:
                  limits:
                    nvidia.com/gpu: ${GPU_PER_NODE}
                    vpc.amazonaws.com/efa: ${EFA_PER_NODE}
                  requests:
                    nvidia.com/gpu: ${GPU_PER_NODE}
                    vpc.amazonaws.com/efa: ${EFA_PER_NODE}
                env:
                  - name: FI_PROVIDER
                    value: "efa"
                  - name: NCCL_DEBUG
                    value: "INFO"
                  - name: NCCL_SOCKET_IFNAME
                    value: "eth0"
                volumeMounts:
                  - name: persistent-storage-s3
                    mountPath: /s3
                    readOnly: false
                  - name: persistent-storage-fsx
                    mountPath: /fsx
                  - name: shmem
                    mountPath: /dev/shm
                  - name: local
                    mountPath: /local
                  - name: inst-nvme
                    mountPath: /nvme
                  - name: local-cache
                    mountPath: /root/.cache
            volumes:
              - name: shmem
                hostPath:
                  path: /dev/shm
              - name: local
                hostPath:
                  path: /mnt/k8s-disks/0
              - name: local-cache
                hostPath:
                  path: /opt/dlami/nvme/.cache
              - name: inst-nvme
                hostPath:
                  path: /opt/dlami/nvme/
              - name: persistent-storage-s3
                persistentVolumeClaim:
                  claimName: s3-claim
              - name: persistent-storage-fsx
                persistentVolumeClaim:
                  claimName: fsx-claim
