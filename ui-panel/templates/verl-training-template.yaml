apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: "${JOB_NAME}"
  namespace: default
spec:
  entrypoint: "bash ${ENTRY_POINT_PATH}"
  # backoffLimit: 0
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      containers:
        - name: ray-job-submitter
          image: rayproject/ray:2.9.0
  rayClusterSpec:
    rayVersion: '2.9.0'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        dashboard-port: '8265'
      template:
        metadata:
          labels:
            hami.io/webhook: ignore
        spec:
          nodeSelector:
            beta.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
          containers:
            - name: ray-head
              image: "${DOCKER_IMAGE}"
              resources:
                limits:
                  # cpu: 20
                  # memory: 80Gi
                  nvidia.com/gpu: ${GPU_PER_NODE}
                  vpc.amazonaws.com/efa: ${EFA_PER_NODE}
                requests:
                  # cpu: 20
                  # memory: 80Gi
                  nvidia.com/gpu: ${GPU_PER_NODE}
                  vpc.amazonaws.com/efa: ${EFA_PER_NODE}
              env:
                # - name: PYTHONPATH
                #   value: "/verl_workspace:/verl_workspace/verl"
                - name: FI_PROVIDER
                  value: "efa"
                - name: NCCL_DEBUG
                  value: "INFO"
                - name: NCCL_SOCKET_IFNAME
                  value: "eth0"
                - name: INSTRT_NUM_NODES
                  value: "${TOT_NUM_NODES}"
                - name: INSTRT_PROC_PER_NODE
                  value: "${GPU_PER_NODE}"
              volumeMounts:
                - name: shmem
                  mountPath: /dev/shm
                - name: local
                  mountPath: /local
                - name: inst-nvme
                  mountPath: /ckpt-path
                - name: local-cache
                  mountPath: /root/.cache
          volumes:
            - name: shmem
              hostPath:
                path: /dev/shm
            - name: local
              hostPath:
                path: /mnt/k8s-disks/0
            - name: local-cache
              hostPath:
                path: /opt/dlami/nvme/.cache
            - name: inst-nvme
              hostPath:
                path: /opt/dlami/nvme/checkpoints/
    workerGroupSpecs:
      - replicas: ${WORKER_REPLICAS}
        minReplicas: 0
        maxReplicas: ${MAX_REPLICAS}
        groupName: worker-group
        rayStartParams: {}
        template:
          metadata:
            labels:
              hami.io/webhook: ignore
          spec:
            nodeSelector:
              beta.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
            containers:
              - name: ray-worker
                image: "${DOCKER_IMAGE}"
                resources:
                  limits:
                    # cpu: 20
                    # memory: 80Gi
                    nvidia.com/gpu: ${GPU_PER_NODE}
                    vpc.amazonaws.com/efa: ${EFA_PER_NODE}
                  requests:
                    # cpu: 20
                    # memory: 80Gi
                    nvidia.com/gpu: ${GPU_PER_NODE}
                    vpc.amazonaws.com/efa: ${EFA_PER_NODE}
                env:
                  # - name: PYTHONPATH
                  #   value: "/verl_workspace:/verl_workspace/verl"
                  - name: FI_PROVIDER
                    value: "efa"
                  - name: NCCL_DEBUG
                    value: "INFO"
                  - name: NCCL_SOCKET_IFNAME
                    value: "eth0"
                  - name: INSTRT_NUM_NODES
                    value: "${TOT_NUM_NODES}"
                  - name: INSTRT_PROC_PER_NODE
                    value: "${GPU_PER_NODE}"
                volumeMounts:
                  - name: shmem
                    mountPath: /dev/shm
                  - name: local
                    mountPath: /local
                  - name: inst-nvme
                    mountPath: /ckpt-path
                  - name: local-cache
                    mountPath: /root/.cache
            volumes:
              - name: shmem
                hostPath:
                  path: /dev/shm
              - name: local
                hostPath:
                  path: /mnt/k8s-disks/0
              - name: local-cache
                hostPath:
                  path: /opt/dlami/nvme/.cache
              - name: inst-nvme
                hostPath:
                  path: /opt/dlami/nvme/checkpoints/
