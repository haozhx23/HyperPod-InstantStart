# SWE sandbox tool config for EKS-backed veRL multi-turn rollouts.
tools:
  - class_name: "tooluse.envs.k8s_sandbox_tool.K8sSWESandboxTool"
    config:
      image: "python:3.12-slim"
      timeout: 120
      setup_timeout: 300
      max_output_len: 8000
      type: native
    tool_schema:
      type: "function"
      function:
        name: "bash"
        description: "Run a bash command in the SWE sandbox."
        parameters:
          type: "object"
          properties:
            command:
              type: "string"
              description: "Bash command to execute in the repo workspace"
          required: ["command"]
