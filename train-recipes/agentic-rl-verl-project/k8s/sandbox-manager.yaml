apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-rl-sandbox-manager
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-rl-sandbox-manager
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-rl-sandbox-manager
  namespace: default
subjects:
  - kind: ServiceAccount
    name: agentic-rl-sandbox-manager
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-rl-sandbox-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-rl-sandbox-manager
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-rl-sandbox-manager
  template:
    metadata:
      labels:
        app: agentic-rl-sandbox-manager
    spec:
      serviceAccountName: agentic-rl-sandbox-manager
      containers:
        - name: manager
          image: __IMAGE_URI__
          imagePullPolicy: Always
          command:
            - bash
            - -lc
            - python /fsx/rl-agentic-on-aws/aws/sandbox/server.py
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_IMAGE_DEFAULT
              value: ubuntu:22.04
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: fsx
              mountPath: /fsx
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: __FSX_CLAIM__
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-rl-sandbox
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: agentic-rl-sandbox-manager
  ports:
    - name: http
      port: 8080
      targetPort: http
