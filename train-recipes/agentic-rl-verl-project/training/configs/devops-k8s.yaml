task: devops-k8s
projectDir: /fsx/rl-agentic-on-aws
modelPath: /fsx/models/Qwen3-0.6B

data:
  train: /fsx/data/devops_gym_verl/train.parquet
  validation: /fsx/data/devops_gym_verl/validation.parquet
  sourceDir: /fsx/rl-agentic-on-aws/data/devops_gym

tool:
  config: /fsx/rl-agentic-on-aws/tooluse/configs/devops_k8s_tool_config.yaml
  # Replace with the ClusterIP URL returned by Inference -> Model Deployment.
  sandboxApiUrl: http://agentic-rl-sandbox.default.svc.cluster.local:8080

reward:
  path: /fsx/rl-agentic-on-aws/tooluse/rewards/devops_reward.py
  name: compute_score

verl:
  projectName: agentic-rl-devops-k8s
  batchSize: 8
  rolloutN: 4
  epochs: 1
  quick: false
  trainGpus: 4
  rolloutGpus: 4
  promptLength: 4096
  responseLength: 32768
  maxAssistantTurns: 25
  maxToolResponseLength: 8000
