task: terminal-k8s
projectDir: /fsx/rl-agentic-on-aws
modelPath: /fsx/models/Qwen3-0.6B

data:
  train: /fsx/data/terminal_verl/train.parquet
  validation: /fsx/data/terminal_verl/validation.parquet

tool:
  config: /fsx/rl-agentic-on-aws/tooluse/configs/terminal_k8s_tool_config.yaml
  # Replace with the ClusterIP URL returned by Inference -> Model Deployment.
  sandboxApiUrl: http://agentic-rl-sandbox.default.svc.cluster.local:8080

reward:
  path: /fsx/rl-agentic-on-aws/tooluse/rewards/terminal_reward.py
  name: compute_score

verl:
  projectName: agentic-rl-terminal-k8s
  batchSize: 8
  rolloutN: 4
  epochs: 1
  quick: false
  trainGpus: 4
  rolloutGpus: 4
  promptLength: 2048
  responseLength: 16384
  maxAssistantTurns: 25
  maxToolResponseLength: 4000
